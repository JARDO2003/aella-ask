<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Aella</span>
      <span class="brand-status" id="statusDot" data-state="connecting">
        <span class="dot"></span>
        <span class="status-label" id="statusLabel">Connexion…</span>
      </span>
    </div>
    <button class="icon-btn" id="newConvBtn" title="Nouvelle conversation" aria-label="Nouvelle conversation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main class="chat" id="chat">
    <div class="empty-state" id="emptyState">
      <p class="empty-title">Une conversation qui se souvient.</p>
      <p class="empty-sub">Écris-lui quelque chose. Aella garde le fil d'une fois sur l'autre.</p>
    </div>
    <div class="log" id="log"></div>
  </main>

  <form class="composer" id="composerForm">
    <textarea
      id="messageInput"
      class="composer-input"
      placeholder="Écris à Aella…"
      rows="1"
      autocomplete="off"
    ></textarea>
    <button type="submit" class="send-btn" id="sendBtn" aria-label="Envoyer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M5 12h13M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
